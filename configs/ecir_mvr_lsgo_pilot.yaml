schema_version: mcvr-lsgo-pilot-config-v1
study_name: learned_structured_geometry_objective_pilot
seeds: [173, 181, 193]

dataset:
  training_compact: E:/3dconformergenerationcode/4dadapter-label-free-score/reports/ecir_mvr/label_free_score_pilot/manifests/TRAIN_ONLY_COMPACT_DATASET.pt
  training_compact_sha256: 72b9ca73e617498f3ea596884585bae473c6017951019b9a3c203bfd015d5479
  drcsr_calibration: E:/3dconformergenerationcode/4dadapter-direct-strain/reports/ecir_mvr/direct_strain/manifests/CONTINUOUS_STRAIN_CALIBRATION.json
  external_compact: reports/ecir_mvr/learned_geometry/manifests/LSGO_EXTERNAL_CONFIRM_COMPACT.pt
  partitions:
    train_molecules: 2000
    dev_a_molecules: 250
    dev_b_molecules: 250
    external_confirm_molecules: 200

model:
  hidden_dim: 128
  layers: 3
  parameter_limit: 800000
  preferred_parameter_range: [200000, 500000]
  bond_mu_range_angstrom: [0.6, 2.4]
  angle_parameterization: cosine
  sigma_floor:
    bond_angstrom: 0.005
    angle_cosine: 0.010
  sigma_max:
    bond_angstrom: 0.200
    angle_cosine: 0.400

training:
  steps: 2500
  batch_molecules: 12
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.000001
  scheduler: cosine
  gradient_clip: 1.0
  checkpoint_steps: [500, 1000, 1500, 2000, 2500]
  sigma_upper_regularization: 0.01
  objective: equal_mean_of_bond_and_angle_primitive_gaussian_nll
  coordinate_targets: false

internal_selection:
  checkpoint_rule: lowest_dev_a_joint_nll_then_calibration_error_then_step
  dev_b_one_shot: true
  likelihood_improvement_required_on_both_dev_a_and_dev_b: true
  sigma_pathology:
    collapse_fraction_max: 0.05
    inflation_fraction_max: 0.05
    constant_relative_iqr_min: 0.02
  reference_stationarity:
    median_gradient_rms_ratio_to_source_max: 1.0
    projected_micro_step_max_angstrom: 0.001
    objective_nonincrease_fraction_min: 0.95
  source_separation:
    source_gt_reference_fraction_min: 0.60
    median_objective_difference_min: 0.0
  solver:
    ridge: 0.001
    rank_tolerance: 0.000001
    maximum_condition: 100000000.0
    finite_fraction_min: 1.0
  budget_candidates_angstrom: [0.001, 0.002, 0.003]
  primary_steps: 1
  secondary_steps: 2
  atom_cap_angstrom: 0.03
  budget_rule: largest_budget_passing_all_internal_safety_then_lowest_joint_objective

external_evaluation:
  posebusters: true
  xtb_single_point: true
  xtb_method: GFN2-xTB
  geometry_optimization: false
  energy_conversion_kcal_per_mol: 627.509474
  no_systematic_pb_regression: true
  failure_transfer_max: 0.01
  xtb_median_max_kcal_per_mol: 0.0
  xtb_improved_fraction_min: 0.60
  movement_max_angstrom: 0.003
  mode_switch_max: 0.005

guards:
  formal_test_records_read: 0
  frozen_holdout_records_read: 0
  full10k_used_for_tuning: false
  mvt_coordinates_used: false
  source_reference_cartesian_delta_used: false
  xtb_training_access: false
  posebusters_training_access: false
  weighted_bac_selection_access: false
  drcsr_coordinate_outputs_used: false
  gaussian_outputs_used: false
  adaptive_sigma: false
  amortized_refiner_training: false

